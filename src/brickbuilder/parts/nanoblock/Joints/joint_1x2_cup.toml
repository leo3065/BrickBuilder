# nanoblock.info "1x2 : JO-C" (block 5): a 1×2 with a cup (socket) centred on a long side, at
# mid-height. Measured: the cup is Ø5.20, out to 5.90 mm from the face, on a neck
# that widens from Ø2.9 at the face to Ø5.20 over 2.75 mm. A ball's centre sits 4.25 mm from the
# face. The cup's slot opens up and down (90° either way), else a 30° cone.
name = "Joint 1×2 cup"

[[body]]
shape = "box"
size = [1, 2, 1]

[[body]]                      # the neck: widens from Ø2.9 at the face to Ø5.2, 2.75 mm out
shape = "cylinder"
at = [1.0, 1.0, 0.5]
axis = "+x"
length_mm = 2.75
diameter_mm = 2.9
end_diameter_mm = 5.2
joint = true

[[body]]                      # the cup itself, out to 5.90 mm
shape = "cylinder"
at = [1.0, 1.0, 0.5]
axis = "+x"
offset_mm = 2.75
length_mm = 3.15
diameter_mm = 5.2
joint = true

[[socket]]
type = "cup"
at = [1.0, 1.0, 0.5]
axis = "+x"
offset_mm = 4.25
