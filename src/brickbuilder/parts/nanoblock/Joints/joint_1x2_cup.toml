# nanoblock.info "1x2 : JO-C" (block 5): a 1×2 with a cup (socket) centred on a long side, at
# mid-height. Measured: the cup is a Ø5.20 mm cylinder sticking out 5.90 mm; a ball's centre sits
# 4.25 mm from the face. The cup's slot opens up and down (90° either way), else a 30° cone.
name = "Joint 1×2 cup"

[[body]]
shape = "box"
size = [1, 2, 1]

[[body]]
shape = "cylinder"
at = [1.0, 1.0, 0.5]
axis = "+x"
length_mm = 5.9
diameter_mm = 5.2
joint = true

[[socket]]
type = "cup"
at = [1.0, 1.0, 0.5]
axis = "+x"
offset_mm = 4.25
