# nanoblock.info "2x2 : JO-D" (block 4): a 2×2 with a ball centred on a side, pointing along its slots, at mid-height.
# Measured: ball Ø4.0 mm, its centre 3.75 mm from the face; the arm is modelled as a Ø1.95 mm
# cylinder (its narrowest, at the ball).
name = "Joint 2×2 ball"

[[body]]
shape = "box"
size = [2, 2, 1]

[[body]]
shape = "cylinder"
at = [1.0, 2.0, 0.5]
axis = "+y"
length_mm = 3.75
diameter_mm = 1.95
joint = true

[[body]]
shape = "sphere"
at = [1.0, 2.0, 0.5]
axis = "+y"
offset_mm = 3.75
diameter_mm = 4.0
joint = true

[[socket]]
type = "ball"
at = [1.0, 2.0, 0.5]
axis = "+y"
offset_mm = 3.75
