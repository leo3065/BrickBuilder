# Nanoblock system profile. Values measured with calipers; see docs/part_format.md.
id = "nanoblock"
name = "Nanoblock"
cell = [4.0, 4.0, 3.125]      # mm: stud pitch X/Y, stacking pitch Z (studs excluded)
subdiv = [2, 2, 1]            # placement sub-grid per cell: half-cells in XY
grid_rotation = 90.0          # rotations that keep a part on its frame's grid
clearance = 0.05              # cosmetic seam between bodies
body_height = 3.05            # rendering only; stacking pitch minus seating gap

[stud]
diameter = 2.65
height = 2.00
hollow_diameter = 0.0         # solid

# Where studs fit under a body when its part file doesn't list antistud sockets (measured from the
# real parts, docs/part_format.md "Undersides"): 1xN and 2xN undersides are hollow slots, one per
# row along the long side; wider footprints (the base plates) take none for now.
[[underside]]
max_short_side = 2
slots = "rows"

[[underside]]
slots = "none"

[socket_types]
stud     = { mates = ["antistud"], dof = "fixed" }
antistud = { mates = ["stud"],     dof = "fixed" }
ball     = { mates = ["cup"],      dof = "spherical" }
cup      = { mates = ["ball"],     dof = "spherical" }

# Official Nanoblock color names (as listed on https://nanoblock.info/nbks/?mode=colorList),
# in that site's order. Ids are stable keys used by save files; RGB values are rough
# eyeballed approximations, not measured. `clear = true` marks translucent colors; their
# opacity is `alpha` (default 0.75 for clear colors, 1.0 otherwise). Rendered opaque until
# semi-transparency is supported.
[palette]
white           = { name = "White",           rgb = "#F4F4F2" }
clear           = { name = "Clear",           rgb = "#FFFFFF", clear = true, alpha = 0.5 }
